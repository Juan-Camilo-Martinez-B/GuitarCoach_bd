name: ci

on:
  push:
  pull_request:

jobs:
  migraciones:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: guitarcoach
          POSTGRES_PASSWORD: guitarcoach
          POSTGRES_DB: guitarcoach
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guitarcoach -d guitarcoach"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://guitarcoach:guitarcoach@localhost:5432/guitarcoach
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de prueba
        run: pip install -r requirements-dev.txt
      - name: Comprobar el emparejado de migraciones y el separador SQL
        run: pytest
